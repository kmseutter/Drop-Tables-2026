<!DOCTYPE html>
<html>
<head>
  <title>URL Settings</title>
  <style>
    body { font-family: sans-serif; padding: 16px; min-width: 340px; }
    .input-group { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type="url"] { flex: 1; padding: 6px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      padding: 6px 0; 
      border-bottom: 1px solid #eee; 
    }
    .remove-btn { color: #d93025; cursor: pointer; background: none; border: none; font-weight: bold; }
  </style>
</head>
<body>
  <form id="urlForm" class="input-group">
    <input type="url" id="urlInput" placeholder="https://example.com" required>
    <button type="submit">Add</button>
  </form>

  <ul id="urlList"></ul>

  <script src="options.js"></script>
</body>
</html>
