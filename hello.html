<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #1e1e2e;
      color: #ffffff;
      width: 220px;
      padding: 16px;
      margin: 0;
    }
    h3 {
      margin: 0 0 12px 0;
      font-size: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #a6adc8;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #45475a;
      background: #313244;
      color: #ffffff;
      font-size: 14px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #89b4fa;
      color: #11111b;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #b4befe;
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
      color: #a6e3a1;
      text-align: center;
      min-height: 16px;
    }
    .progress-section {
      margin-top: 20px;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .progress-track {
      height: 12px;
      background: #45475a;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: #a6e3a1;
      transition: width 0.25s ease;
    }
    .progress-detail {
      margin-top: 7px;
      color: #a6adc8;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h3>Doomstopper Settings</h3>
  <label for="delayInput">Delay (seconds):</label>
  <input type="number" id="delayInput" min="1" value="5" />
  <button id="saveBtn">Save &amp; Restart Timer</button>
  <div id="status"></div>

  <section class="progress-section" aria-label="Quiz progress">
    <div class="progress-header">
      <strong>Quiz Progress</strong>
      <strong id="levelText">Level 1</strong>
    </div>
    <div class="progress-track" id="progressBarTrack" role="progressbar" aria-label="Progress toward next level"
    aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
      <div id="progressBar" class="progress-fill"></div>
    </div>
    <div id="progressText" class="progress-detail">0 / 3 to next level</div>
    <div id="totalText" class="progress-detail"> 0 correct answers total</div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
