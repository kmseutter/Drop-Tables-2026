<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #1e1e2e;
      color: #ffffff;
      width: 220px;
      padding: 16px;
      margin: 0;
    }
    h3 {
      margin: 0 0 12px 0;
      font-size: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #a6adc8;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #45475a;
      background: #313244;
      color: #ffffff;
      font-size: 14px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #89b4fa;
      color: #11111b;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #b4befe;
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
      color: #a6e3a1;
      text-align: center;
      min-height: 16px;
    }
    ul { 
      list-style: none;
      padding: 0; 
      margin: 0; }
    li { 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      padding: 6px 0; 
      border-bottom: 1px solid #eee; 
    }
    button.remove-btn { 
      cursor: pointer;
      border: none;
      font-weight: bold;
      width: auto;
    }

  </style>
</head>
<body>
  <h3>Doomstopper Settings</h3>
  <label for="delayInput">Delay (seconds):</label>
  <input type="number" id="delayInput" min="1" value="5" />
  <button id="saveBtn">Save &amp; Restart Timer</button>
  <div id="status"></div>

  <form id="urlForm" class="input-group">
    <input type="url" id="urlInput" placeholder="https://example.com" required>
    <button type="submit">Add</button>
  </form>

  <ul id="urlList"></ul>

  <script src="popup.js"></script>
  <script src="options.js"></script>
</body>
</html>
